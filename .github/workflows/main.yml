name: Build

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

env:
  NODE_ENV: production

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-external:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PenguinMod Extension Gallery
            repo: PenguinMod/PenguinMod-ExtensionsGallery
            dir: PenguinMod-ExtensionsGallery
            output: public
            artifact: penguinmod-extensions-gallery

          - name: TurboWarp Extension Gallery
            repo: TurboWarp/extensions
            dir: TurboWarp-ExtensionsGallery
            output: build
            artifact: turbowarp-extensions-gallery

          - name: PenguinMod Home
            repo: PenguinMod/PenguinMod-Home
            dir: PenguinMod-Home
            output: public
            artifact: penguinmod-home

    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: bun-${{ runner.os }}

      - name: Clone repo
        run: git clone --depth=1 --single-branch --filter=blob:none https://github.com/${{ matrix.repo }}.git ${{ matrix.dir }}

      - name: Compute dependency hash
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f bun.lockb ]; then
            HASH_FILE="bun.lockb"
          else
            HASH_FILE="package.json"
          fi
          echo "LOCK_HASH=$(sha256sum "$HASH_FILE" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Cache node_modules
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/node_modules
          key: ${{ runner.os }}-${{ matrix.artifact }}-${{ env.LOCK_HASH }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.dir }}
        run: bun install --frozen-lockfile
        
      - name: Setup .env for PenguinMod-Home
        if: matrix.dir == 'PenguinMod-Home'
        working-directory: ${{ matrix.dir }}
        run: mv .env.template .env

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: bun run build

      - name: Upload built output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/${{ matrix.output }}
          if-no-files-found: error

  build-app:
    name: Build desktop app
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-external

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl jq zip unzip \
            wine32 wine64

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: bun-${{ runner.os }}

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}

      - name: Generate release metadata
        run: |
          echo "TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "TIMESTAMP_TAG=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Build #${{ github.run_number }} — ${{ github.workflow }} (${{ github.run_id }}) — $(date +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=build-${{ github.run_id }}-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Clone PenguinMod GUI
        run: git clone --depth=1 --single-branch --filter=blob:none https://github.com/PenguinMod/penguinmod.github.io.git

      - name: Clone GUI sub-repos
        run: |
          cd penguinmod.github.io
          git clone --depth=1 --single-branch --filter=blob:none https://github.com/PenguinMod/PenguinMod-Vm.git
          git clone --depth=1 -b develop-builds --single-branch --filter=blob:none https://github.com/PenguinMod/PenguinMod-Blocks.git
          git clone --depth=1 --single-branch --filter=blob:none https://github.com/PenguinMod/PenguinMod-Render.git
          git clone --depth=1 --single-branch --filter=blob:none https://github.com/PenguinMod/PenguinMod-Paint.git

      - name: Compute dependency hashes
        run: |
          hash_file () {
            if [ -f "$1/bun.lockb" ]; then
              sha256sum "$1/bun.lockb" | awk '{print $1}'
            else
              sha256sum "$1/package.json" | awk '{print $1}'
            fi
          }

          echo "ROOT_HASH=$(hash_file .)" >> "$GITHUB_ENV"
          echo "GUI_HASH=$(hash_file penguinmod.github.io)" >> "$GITHUB_ENV"
          echo "VM_HASH=$(hash_file penguinmod.github.io/PenguinMod-Vm)" >> "$GITHUB_ENV"
          echo "BLOCKS_HASH=$(hash_file penguinmod.github.io/PenguinMod-Blocks)" >> "$GITHUB_ENV"
          echo "RENDER_HASH=$(hash_file penguinmod.github.io/PenguinMod-Render)" >> "$GITHUB_ENV"
          echo "PAINT_HASH=$(hash_file penguinmod.github.io/PenguinMod-Paint)" >> "$GITHUB_ENV"

      - name: Cache root production node_modules
        id: root-prod-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-root-prod-${{ env.ROOT_HASH }}

      - name: Cache GUI node_modules
        id: gui-cache
        uses: actions/cache@v4
        with:
          path: penguinmod.github.io/node_modules
          key: ${{ runner.os }}-gui-${{ env.GUI_HASH }}

      - name: Cache VM node_modules
        id: vm-cache
        uses: actions/cache@v4
        with:
          path: penguinmod.github.io/PenguinMod-Vm/node_modules
          key: ${{ runner.os }}-vm-${{ env.VM_HASH }}

      - name: Cache Blocks node_modules
        id: blocks-cache
        uses: actions/cache@v4
        with:
          path: penguinmod.github.io/PenguinMod-Blocks/node_modules
          key: ${{ runner.os }}-blocks-${{ env.BLOCKS_HASH }}

      - name: Cache Render node_modules
        id: render-cache
        uses: actions/cache@v4
        with:
          path: penguinmod.github.io/PenguinMod-Render/node_modules
          key: ${{ runner.os }}-render-${{ env.RENDER_HASH }}

      - name: Cache Paint node_modules
        id: paint-cache
        uses: actions/cache@v4
        with:
          path: penguinmod.github.io/PenguinMod-Paint/node_modules
          key: ${{ runner.os }}-paint-${{ env.PAINT_HASH }}

      - name: Install root production deps
        if: steps.root-prod-cache.outputs.cache-hit != 'true'
        run: bun install --production --frozen-lockfile

      - name: Install GUI deps
        if: steps.gui-cache.outputs.cache-hit != 'true'
        working-directory: penguinmod.github.io
        run: bun install --frozen-lockfile

      - name: Install VM deps
        if: steps.vm-cache.outputs.cache-hit != 'true'
        working-directory: penguinmod.github.io/PenguinMod-Vm
        run: bun install --frozen-lockfile

      - name: Install Blocks deps
        if: steps.blocks-cache.outputs.cache-hit != 'true'
        working-directory: penguinmod.github.io/PenguinMod-Blocks
        run: bun install --frozen-lockfile

      - name: Install Render deps
        if: steps.render-cache.outputs.cache-hit != 'true'
        working-directory: penguinmod.github.io/PenguinMod-Render
        run: bun install --frozen-lockfile

      - name: Install Paint deps
        if: steps.paint-cache.outputs.cache-hit != 'true'
        working-directory: penguinmod.github.io/PenguinMod-Paint
        run: bun install --frozen-lockfile

      - name: Download external build artifacts
        uses: actions/download-artifact@v4
        with:
          name: penguinmod-extensions-gallery
          path: app/PenguinMod-ExtensionsGallery

      - name: Download TurboWarp build artifacts
        uses: actions/download-artifact@v4
        with:
          name: turbowarp-extensions-gallery
          path: app/TurboWarp-ExtensionsGallery

      - name: Download PenguinMod Home artifacts
        uses: actions/download-artifact@v4
        with:
          name: penguinmod-home
          path: app/PenguinMod-Home

      - name: Build PenguinMod Web
        run: |
          cd penguinmod.github.io

          bun run build
          cp -R build ../app

          cd ..
          rm -rf app/package.json app/node_modules

          cd PenguinMod-Home
          bun run build
          cp -R public ../app

          cd ..
          cp -R SharkPools-Extensions app/

      - name: Build Electron App
        run: |
          npx electron-builder --linux AppImage deb rpm --win nsis --publish never

      - name: Zip linux-unpacked
        run: zip -r builds/linux-unpacked.zip builds/linux-unpacked

      - name: Zip win-unpacked
        run: zip -r builds/win-unpacked.zip builds/win-unpacked

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: true
          draft: false
          body: |
            ## Automated Build

            | Field        | Value |
            |-------------|-------|
            | **Run ID**   | `${{ github.run_id }}` |
            | **Run #**    | `${{ github.run_number }}` |
            | **Workflow** | `${{ github.workflow }}` |
            | **Trigger**  | `${{ github.event_name }}` |
            | **Branch**   | `${{ github.ref_name }}` |
            | **Commit**   | `${{ github.sha }}` |
            | **Built at** | `${{ env.TIMESTAMP }}` |
          files: |
            builds/*.deb
            builds/*.rpm
            builds/*.AppImage
            builds/*.exe
            builds/linux-unpacked.zip
            builds/win-unpacked.zip
