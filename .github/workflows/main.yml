name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/npm-snapshot.yml'   # its own manual workflow; changing it doesn't change the app

env:
  NODE_ENV: 'production'
  # Test tools in the GUI (chromedriver) and Render (playwright-chromium) would download browsers
  # from Google / Microsoft during a fresh install; the build doesn't use them.
  CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    # Fixed versions (Session 29): the runner image, Bun and Node are exact, and each action is pinned
    # to the commit of the version named in its comment, so the toolchain only changes when we edit it.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # --- Checkout ---
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Generate Dynamic Cache Key Components ---
      - name: Get current week
        run: echo "WEEK_STAMP=$(date +'%Y-%U')" >> $GITHUB_ENV

      # --- Generate Release Metadata ---
      - name: Generate release metadata
        run: |
          echo "TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "TIMESTAMP_TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
          echo "RELEASE_NAME=Build #${{ github.run_number }} — ${{ github.workflow }} (${{ github.run_id }}) — $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${{ github.run_id }}-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      # --- Install system dependencies ---
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git curl jq zip unzip wine32 wine64

      # --- Install Bun ---
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # --- Install Node.js ---
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0

      # --- npm snapshot: every package the build installs (release made by npm-snapshot.yml) ---
      # npm-snapshot.json says which release. It becomes Bun's cache, so the installs below take
      # these packages from it instead of the npm registry; anything not in it still comes from npm
      # (the check after the installs warns). Linux-only (made on this runner image).
      - name: Restore npm snapshot
        run: |
          TAG=$(jq -r .tag npm-snapshot.json)
          ASSET=$(jq -r .asset npm-snapshot.json)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/npm-snapshot.tar.gz" "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET"
          echo "$(jq -r .sha256 npm-snapshot.json)  $RUNNER_TEMP/npm-snapshot.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/npm-snapshot.tar.gz"
          rm "$RUNNER_TEMP/npm-snapshot.tar.gz"
          if [ "$(jq -r .bun npm-snapshot.json)" != "$(bun --version)" ]; then
            echo "::warning::npm snapshot $TAG was made with Bun $(jq -r .bun npm-snapshot.json), this build uses $(bun --version): make a new snapshot"
          fi
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
          echo "SNAPSHOT_ENTRIES=$(ls "$RUNNER_TEMP/bun-cache" | wc -l)" >> "$GITHUB_ENV"
          echo "Restored $TAG: $(ls "$RUNNER_TEMP/bun-cache" | wc -l) cache entries"

      # --- Clone Standalone Repos and Cache ---
      # Every upstream project is downloaded at the exact commit listed in upstream.json
      # (scripts/clone-pinned.js), so upstream changes only reach the app when that file is changed.

      # PenguinMod Extension Gallery
      - name: Clone PenguinMod Extension Gallery
        run: node scripts/clone-pinned.js PenguinMod-ExtensionsGallery

      - name: Install PenguinMod ext gallery deps
        run: |
          cd PenguinMod-ExtensionsGallery
          bun i --frozen-lockfile
          bun run build

      # TurboWarp Extension Gallery
      - name: Clone TurboWarp Extension Gallery
        run: node scripts/clone-pinned.js TurboWarp-ExtensionsGallery

      - name: Cache TurboWarp node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: TurboWarp-ExtensionsGallery/node_modules
          key: node-modules-turbowarp-${{ env.WEEK_STAMP }}
          restore-keys: |
            node-modules-turbowarp-

      - name: Install TurboWarp deps
        run: |
          cd TurboWarp-ExtensionsGallery
          bun i --frozen-lockfile
          bun run build

      # SharkPool Extension Gallery
      - name: Clone SharkPool Extension Gallery
        run: node scripts/clone-pinned.js SharkPools-Extensions

      # --- Clone PenguinMod GUI Main Repository ---
      - name: Clone PenguinMod GUI
        run: node scripts/clone-pinned.js penguinmod.github.io

      # --- CONSOLIDATED GUI & SUBMODULES CACHE ---
      - name: Cache GUI and Submodule node_modules
        id: gui-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            penguinmod.github.io/node_modules
            penguinmod.github.io/PenguinMod-Vm/node_modules
            penguinmod.github.io/PenguinMod-Blocks/node_modules
            penguinmod.github.io/PenguinMod-Render/node_modules
            penguinmod.github.io/PenguinMod-Paint/node_modules
          key: node-modules-penguinmod-combined-${{ hashFiles('penguinmod.github.io/package.json') }}-${{ env.WEEK_STAMP }}
          restore-keys: |
            node-modules-penguinmod-combined-${{ hashFiles('penguinmod.github.io/package.json') }}-
            node-modules-penguinmod-combined-

      # --- Process Submodules and Run Updates ---
      - name: Setup GUI Dependencies & Submodules
        run: |
          cd penguinmod.github.io
          
          node ../scripts/clone-pinned.js PenguinMod-Vm
          node ../scripts/clone-pinned.js PenguinMod-Blocks
          node ../scripts/clone-pinned.js PenguinMod-Render
          node ../scripts/clone-pinned.js PenguinMod-Paint
          
          if [ -d "node_modules/scratch-vm/node_modules" ]; then
            mv node_modules/scratch-vm/node_modules PenguinMod-Vm/
          fi
          if [ -d "node_modules/scratch-blocks/node_modules" ]; then
            mv node_modules/scratch-blocks/node_modules PenguinMod-Blocks/
          fi
          if [ -d "node_modules/scratch-render/node_modules" ]; then
            mv node_modules/scratch-render/node_modules PenguinMod-Render/
          fi
          if [ -d "node_modules/scratch-paint/node_modules" ]; then
            mv node_modules/scratch-paint/node_modules PenguinMod-Paint/
          fi
          
          # Every project installs exactly what its committed bun.lock says (git packages come from
          # the forks on this account); an install that would change the lockfile fails instead.
          bun i --frozen-lockfile
          cd PenguinMod-Vm && bun i --frozen-lockfile && cd ..
          cd PenguinMod-Blocks && bun i --frozen-lockfile && cd ..
          cd PenguinMod-Render && bun i --frozen-lockfile && cd ..
          cd PenguinMod-Paint && bun i --frozen-lockfile && cd ..
          
          rm -rf node_modules/scratch-vm && mv PenguinMod-Vm node_modules/scratch-vm
          rm -rf node_modules/scratch-blocks && mv PenguinMod-Blocks node_modules/scratch-blocks
          rm -rf node_modules/scratch-render && mv PenguinMod-Render node_modules/scratch-render
          rm -rf node_modules/scratch-paint && mv PenguinMod-Paint node_modules/scratch-paint
      # The editor changes are commits in the forks (branch desktop of the GUI, VM and Render
      # forks, pinned in upstream.json), so nothing is patched here.
      # --- Build Web App ---
      - name: Build PenguinMod Web
        run: |
          cd penguinmod.github.io
          bun run build
          cp -R build ../app
          cd ..
          rm -rf app/package.json app/node_modules
          cp -R SharkPools-Extensions app/
          cp -R TurboWarp-ExtensionsGallery/build app/TurboWarp-ExtensionsGallery
          cp -R PenguinMod-ExtensionsGallery/public app/PenguinMod-ExtensionsGallery

      # --- PenguinMod Packager (served offline at studio.penguinmod.com/PenguinMod-Packager/) ---
      # Built with the editor's own VM and Render (the upstream.json commits installed above, copied
      # over the ones in its bun.lock), so packaged projects run the same engine as the editor.
      - name: Clone PenguinMod Packager
        run: node scripts/clone-pinned.js PenguinMod-Packager

      - name: Build PenguinMod Packager
        run: |
          cd PenguinMod-Packager
          bun i --frozen-lockfile
          rm -rf node_modules/scratch-vm node_modules/scratch-render
          cp -R ../penguinmod.github.io/node_modules/scratch-vm node_modules/scratch-vm
          cp -R ../penguinmod.github.io/node_modules/scratch-render node_modules/scratch-render
          bun run build
          cp -R dist ../app/PenguinMod-Packager

      # --- Install prod-only deps ---
      - name: Install production deps
        run: |
          rm -rf node_modules
          mkdir node_modules
          bun i --frozen-lockfile --omit=dev

      # electron-builder and its tools at the versions in bun.lock, installed outside the project so
      # the app's node_modules stays production-only (ELECTRON_SKIP_BINARY_DOWNLOAD: electron-builder
      # downloads the Electron zip itself; the npm package's own download isn't needed).
      - name: Install electron-builder
        run: |
          mkdir -p "$RUNNER_TEMP/electron-builder"
          cp package.json bun.lock "$RUNNER_TEMP/electron-builder/"
          cd "$RUNNER_TEMP/electron-builder"
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 bun i --frozen-lockfile

      # A package that was not in the npm snapshot was downloaded into Bun's cache, which then has
      # more entries than the snapshot had: time for a new snapshot (npm-snapshot.yml).
      - name: Check the npm snapshot covered every package
        run: |
          NOW=$(ls "$BUN_INSTALL_CACHE_DIR" | wc -l)
          if [ "$NOW" -gt "$SNAPSHOT_ENTRIES" ]; then
            echo "::warning::$((NOW - SNAPSHOT_ENTRIES)) package(s) came from the internet, not the npm snapshot: make a new snapshot"
          else
            echo "All packages came from the npm snapshot ($NOW cache entries)."
          fi

      # --- Build Electron App ---
      # Tells the app which release it was built as, so "Check for Updates" can tell if there is a newer one
      - name: Write build info
        run: |
          echo "{\"tag\":\"${{ env.RELEASE_TAG }}\",\"builtAt\":\"${{ env.TIMESTAMP }}\"}" > app/build-info.json
          cat app/build-info.json

      # --- Offline library (Kenney, game-icons.net, sound generators) ---
      # Built once with scripts/make-offline-library.mjs and published as its own release;
      # app/offline-library.json says which one. It goes into the installer (resources/offline-library)
      # but not into win-unpacked.zip: the updater downloads it only when its version changes.
      - name: Download offline library
        run: |
          TAG=$(jq -r .tag app/offline-library.json)
          ASSET=$(jq -r .asset app/offline-library.json)
          curl -fsSL --retry 3 -o offline-library.zip "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET"
          echo "$(jq -r .sha256 app/offline-library.json)  offline-library.zip" | sha256sum -c -
          unzip -q offline-library.zip
          rm offline-library.zip
          test "$(jq -r .version offline-library/version.json)" = "$(jq -r .version app/offline-library.json)"

      # --- Electron for the packager's Windows target (release packager-electron-<n>) ---
      # app/packager-electron.json says which. Like the offline library it goes into the installer
      # (resources/packager-electron, the zip as it is + version.json) but not into win-unpacked.zip:
      # the app downloads it only when its version changes or it is missing.
      - name: Download packager Electron
        run: |
          TAG=$(jq -r .tag app/packager-electron.json)
          ASSET=$(jq -r .asset app/packager-electron.json)
          mkdir packager-electron
          curl -fsSL --retry 3 -o "packager-electron/$ASSET" "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET"
          echo "$(jq -r .sha256 app/packager-electron.json)  packager-electron/$ASSET" | sha256sum -c -
          echo "{\"version\":\"$(jq -r .version app/packager-electron.json)\"}" > packager-electron/version.json

      - name: Build Electron App
        # Windows only (was: --linux AppImage deb rpm --win nsis). See CHANGES.md to bring Linux back.
        run: '"$RUNNER_TEMP/electron-builder/node_modules/.bin/electron-builder" --win nsis --publish never'

      # --- Zip artifacts ---
      - name: Zip win-unpacked
        run: |
          zip -r builds/win-unpacked.zip builds/win-unpacked -x 'builds/win-unpacked/resources/offline-library/*' 'builds/win-unpacked/resources/packager-electron/*'
          # The installer has the offline library and the packager's Electron; the update zip must not
          # (the updater downloads them separately).
          test -f builds/win-unpacked/resources/offline-library/index.json
          test -f "builds/win-unpacked/resources/packager-electron/$(jq -r .asset app/packager-electron.json)"
          if unzip -Z1 builds/win-unpacked.zip | grep -q '^builds/win-unpacked/resources/\(offline-library\|packager-electron\)/'; then
            echo "The offline library or the packager's Electron ended up in win-unpacked.zip"; exit 1
          fi

      # --- Create GitHub Release (the old create-release / upload-release-asset actions are deprecated) ---
      # GitHub turns spaces in file names into dots, so the installer is renamed here to be explicit:
      # "PenguinMod Desktop Setup 1.0.0.exe" -> "PenguinMod.Desktop.Setup.1.0.0.exe"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE=$(ls builds/*.exe | head -1)
          EXE_NAME=$(basename "$EXE")
          mv "$EXE" "builds/${EXE_NAME// /.}"

          cat > release-notes.md <<'NOTES'
          ## Automated Build

          | Field        | Value |
          |-------------|-------|
          | **Run ID**   | `${{ github.run_id }}` |
          | **Run #**    | `${{ github.run_number }}` |
          | **Workflow** | `${{ github.workflow }}` |
          | **Trigger**  | `${{ github.event_name }}` |
          | **Branch**   | `${{ github.ref_name }}` |
          | **Commit**   | `${{ github.sha }}` |
          | **Built at** | `${{ env.TIMESTAMP }}` |
          NOTES

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --prerelease \
            "builds/${EXE_NAME// /.}" \
            builds/win-unpacked.zip
